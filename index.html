<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<title>DADDYBOT ULTRA AI</title>
<style>
body { background: black; color: white; font-family: Arial; text-align: center; padding: 20px; }
h1 { color: gold; }
select, input, button { padding: 12px; margin: 8px; border-radius: 8px; border: none; font-size: 16px; }
button { background: gold; color: black; font-weight: bold; cursor: pointer; }
#chat { background: #111; border: 2px solid gold; border-radius: 10px; padding: 15px; height: 300px; overflow-y: auto; text-align: left; margin: 20px auto; max-width: 600px; }
</style>
</head>
<body>
<h1>👔 DADDYBOT ULTRA AI 👔</h1>

<select id="mode">
  <option value="A">A: Strict Daddy</option>
  <option value="B">B: Sarcastic Daddy</option>
  <option value="C">C: Dumb Daddy</option>
  <option value="D">D: Angry Daddy</option>
  <option value="E">E: Nice Daddy</option>
  <option value="F">F: Disappointed Daddy</option>
</select>
<br>
<input id="userInput" type="text" placeholder="Typ iets tegen Daddy..." style="width: 400px;">
<button onclick="talk()">SEND</button>

<div id="chat"></div>

<script>
const API_KEY = "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"; // <-- JOUW NIEUWE KEY HIER

const personalities = {
  A: "Je bent Strict Daddy. Streng en kortaf. Gebruik CAPS.",
  B: "Je bent Sarcastic Daddy. Heel sarcastisch en oogrol.",
  C: "Je bent Dumb Daddy. Je vergeet alles en praat over eten.",
  D: "Je bent Angry Daddy. Je SCHREEUWT en wordt boos.",
  E: "Je bent Nice Daddy. Lief en zegt 'ik ben trots op je ❤️'",
  F: "Je bent Disappointed Daddy. 'Ik had meer van je verwacht...'"
};

async function talk() {
  const mode = document.getElementById('mode').value;
  const msg = document.getElementById('userInput').value;
  const chat = document.getElementById('chat');

  if(!msg) return;

  chat.innerHTML += `<div><b>Jij:</b> ${msg}</div>`;
  document.getElementById('userInput').value = '';
  chat.innerHTML += `<div><b>Daddy:</b> Denken...</div>`;

  const res = await fetch("https://openrouter.ai/api/v1/chat/completions", {
    method: "POST",
    headers: {
      "Authorization": "Bearer " + API_KEY,
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      "model": "meta-llama/llama-3.1-8b-instruct:free",
      "messages": [
        {"role": "system", "content": personalities[mode]},
        {"role": "user", "content": msg}
      ]
    })
  });
  const data = await res.json();
  const reply = data.choices[0].message.content;
  chat.innerHTML = chat.innerHTML.replace("Denken...", reply);
}
</script>
</body>
</html>
