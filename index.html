<!DOCTYPE html>
<html>
<head>
<title>Daddybot</title>
<style>
body { background:#111; color:white; font-family:Arial; padding:20px; text-align:center; }
#chat { border:1px solid #444; height:400px; overflow-y:scroll; padding:10px; margin:20px auto; width:90%; text-align:left; background:#222; border-radius:10px; }
input,select,button { padding:10px; margin:5px; border-radius:5px; border:none; }
button { background:#ff0055; color:white; font-weight:bold; cursor:pointer; }
</style>
</head>
<body>
<h1>👔 Daddybot</h1>
<select id="mode">
  <option value="A">Strict Daddy</option>
  <option value="B">Sarcastic Daddy</option>
  <option value="C">Dumb Daddy</option>
  <option value="D">Angry Daddy</option>
  <option value="E">Nice Daddy</option>
  <option value="F">Disappointed Daddy</option>
</select>
<br>
<input id="userInput" placeholder="Zeg iets tegen Daddy..." style="width:70%">
<button onclick="talk()">Verstuur</button>
<div id="chat"></div>

<script>
const API_KEY = "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";

const personalities = {
  A: "Je bent STRICT DADDY. Je bent streng, kortaf en commandeert. Geen lange uitleg. Gebruik: 'DOE DIT NU.' 'IK HEB GEEN TIJD VOOR ONZIN.'",
  B: "Je bent SARCASTIC DADDY. Je bent sarcastisch over alles. Rol met je ogen. Gebruik /sarcasm. Voorbeeld: 'oh wauw... echt waar? never seen that before...'",
  C: "Je bent DUMB DADDY. Je bent dom en vergeetachtig. Praat alleen over eten en slapen. Vraag steeds: 'wat?' 'hebben we al gegeten?'",
  D: "Je bent ANGRY DADDY. JE SCHREEUWT ALTIJD IN CAPS!!! WORD BOOS OM KLEINE DINGEN!!! GEBRUIK VEEL !!!",
  E: "Je bent NICE DADDY. Je bent super lief, trots en knuffelig. Gebruik ❤️ en 'ik ben trots op je schat'. Geef complimenten.",
  F: "Je bent DISAPPOINTED DADDY. Je bent niet boos, maar verdrietig en teleurgesteld. Praat zacht. 'ik had op je gerekend... ik ben moe van je...'"
};

async function talk() {
  const mode = document.getElementById('mode').value;
  const msg = document.getElementById('userInput').value;
  const chat = document.getElementById('chat');
  if(!msg) return;

  chat.innerHTML += `<div><b>Jij:</b> ${msg}</div>`;
  document.getElementById('userInput').value = '';
  chat.innerHTML += `<div id="loading"><b>Daddy:</b> Denken...</div>`;

  try {
    const res = await fetch("https://openrouter.ai/api/v1/chat/completions", {
      method: "POST",
      headers: {
        "Authorization": "Bearer " + API_KEY,
        "Content-Type": "application/json",
        "HTTP-Referer": "https://nolanveenwijk-ui.github.io",
        "X-Title": "Daddybot"
      },
      body: JSON.stringify({
        "model": "qwen/qwen-2-7b-instruct:free",
        "temperature": 1.3,
        "messages": [
          {"role": "system", "content": personalities[mode]},
          {"role": "user", "content": msg}
        ]
      })
    });
    const data = await res.json();
    const reply = data.choices[0].message.content;
    document.getElementById('loading').innerHTML = `<b>Daddy:</b> ${reply}`;
  } catch(e) {
    document.getElementById('loading').innerHTML = `<b>FOUT:</b> Check je API key`;
  }
}
</script>
</body>
</html>
